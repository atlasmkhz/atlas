<script>
(function(){
  // ── 지점 데이터 — 시간 순서. post는 자료실 「이란 현대사」 시리즈가
  //    만들어지면 채운다(지금은 비워둠 — 링크가 뜨지 않는다). ──
  const WAYPOINTS = [
    { year:'1901', place:'이란 테헤란', lat:35.6892, lng:51.3890, zoom:5,
      title:'다시 채굴권 — 한 장의 계약서에서 시작되다',
      desc:'카자르 왕조의 모자파르 앗딘 샤가 영국인 사업가 윌리엄 녹스 다시에게 60년간 이란 전역의 석유 탐사·채굴 독점권을 넘긴다. 대가는 미미했다. 한 나라의 지하자원이 외국인 개인의 소유가 된 이 계약이, 이후 100년의 모든 갈등의 출발점이 된다.',
      post:'darcy_1901' },
    { year:'1908', place:'이란 마스제드솔레이만', lat:31.9364, lng:49.3039, zoom:6,
      title:'중동 최초의 유전 — 석유가 터지다',
      desc:'7년의 탐사 끝에 이란 남서부에서 중동 최초의 상업 유전이 발견된다. 이듬해 앵글로-페르시안 석유회사(APOC, 훗날의 BP)가 설립되고, 1914년 영국 정부가 과반 지분을 인수한다. 이란의 석유는 영국 해군의 연료가 되었고, 이란은 그 수익에서 사실상 배제되었다.',
      post:'darcy_1901' },
    { year:'1951', place:'이란 테헤란 의회', lat:35.6944, lng:51.4215, zoom:6,
      title:'모사데크의 석유 국유화',
      desc:'선거로 선출된 총리 모하마드 모사데크가 이끄는 의회가 석유 산업 국유화를 의결한다. 반세기 만에 이란이 자국 석유를 되찾겠다고 선언한 것이다. 영국은 이란산 원유에 대한 국제 봉쇄로 맞섰고, 이란 경제는 급속히 고립된다.',
      post:'mosaddegh_1951' },
    { year:'1953', place:'이란 테헤란', lat:35.7000, lng:51.4000, zoom:6,
      title:'아약스 작전 — CIA와 MI6의 쿠데타',
      desc:'8월 19일, 미국 CIA와 영국 MI6가 공모한 쿠데타로 모사데크가 축출된다. 민주적으로 선출된 정부가 외국 정보기관에 의해 무너진 이 사건은, 이후 수십 년간 이란 사회에 반서방 정서의 뿌리로 남는다. 팔라비 국왕이 복귀하고 친미 왕정이 강화된다.',
      post:'ajax_1953' },
    { year:'1979', place:'이란 테헤란', lat:35.7219, lng:51.3347, zoom:6,
      title:'이슬람 혁명 — 왕정의 붕괴',
      desc:'축적된 반왕정·반서방 정서가 폭발해 팔라비 왕조가 무너지고, 망명에서 돌아온 호메이니가 이슬람 공화국을 세운다. 같은 해 미국 대사관 인질 사건이 터지며 미국과 이란의 관계는 완전히 단절된다. 1953년에 심어진 씨앗이 26년 만에 열매를 맺은 셈이었다.',
      post:'revolution_1979' },
    { year:'1980', place:'이라크·이란 국경 샤트알아랍', lat:30.4500, lng:48.1800, zoom:6,
      title:'이란-이라크 전쟁 — 8년의 소모전',
      desc:'이라크의 사담 후세인이 혁명 직후의 혼란을 틈타 침공하며 8년 전쟁이 시작된다. 양측 합쳐 백만 명 안팎이 희생된 이 전쟁 중, 유조선을 서로 공격하는 이른바 "탱커 전쟁"이 벌어지며 호르무즈 해협이 처음으로 세계 경제의 인질이 된다.',
      post:'iran_iraq_war' },
    { year:'1988', place:'호르무즈 해협', lat:26.5667, lng:56.2500, zoom:7,
      title:'이란항공 655편 격추 — 290명의 희생',
      desc:'미 해군 순양함 빈센스호가 호르무즈 해협 상공의 이란 민항기를 전투기로 오인해 격추, 탑승자 290명 전원이 사망한다. 미국은 오인이라 밝혔으나 공식 사과는 하지 않았고, 이란에서 이 사건은 오늘까지 미국 불신의 상징으로 기억된다.',
      post:'iran_iraq_war' },
    { year:'2015', place:'오스트리아 빈', lat:48.2082, lng:16.3738, zoom:5,
      title:'이란 핵합의(JCPOA) — 잠시 열린 문',
      desc:'이란과 주요 6개국이 핵 프로그램을 제한하는 대신 경제 제재를 푸는 합의에 도달한다. 수십 년 만의 외교적 돌파구였다. 그러나 2018년 미국이 일방적으로 합의를 탈퇴하고 제재를 복원하면서, 이 문은 다시 닫힌다.',
      post:'jcpoa_2015' },
    { year:'2025', place:'이란 포르도·나탄즈', lat:34.8847, lng:50.9958, zoom:6,
      title:'핵시설 공습과 의회의 봉쇄 의결',
      desc:'6월, 이스라엘과의 분쟁이 격화되는 가운데 미국이 이란 본토의 핵시설을 폭격한다. 6월 22일 이란 의회는 호르무즈 해협 봉쇄를 의결한다. 세계 석유 물동량의 약 20%가 지나는 이 좁은 길목이, 다시 한 번 협상의 지렛대로 등장한다.',
      post:'hormuz_today' },
    { year:'2026', place:'호르무즈 해협', lat:26.6000, lng:56.4000, zoom:7,
      title:'전쟁과 봉쇄 — 세계가 걸린 길목',
      desc:'2월 말 미국·이스라엘의 대규모 공습으로 최고지도자 하메네이를 포함한 수뇌부가 사망하고, 이란은 호르무즈 해협 봉쇄로 대응한다. 국제 유가는 배럴당 100달러를 넘어섰고, 한국 선박들도 해협에 발이 묶였다. 4월 파키스탄 중재로 휴전에 이르지만, 이후에도 충돌과 선박 피격이 반복된다.',
      post:'hormuz_today' },
    { year:'오늘', place:'호르무즈 해협 · 오만만', lat:25.5000, lng:57.5000, zoom:6,
      title:'아직 끝나지 않은 100년',
      desc:'2026년 8월 현재, 이란은 오만과 해협 관리 방안을 협의하며 "과거의 상태로 돌아가는 일은 없다"고 말한다. 미국은 이란이 통제하지 않는 항로를 요구하고, 이란은 이를 거부한다. 1901년 한 장의 채굴권 계약에서 시작된 물음 — 이 자원과 이 바닷길은 누구의 것인가 — 은 아직 답을 얻지 못했다.',
      post:'hormuz_today' },
  ];

  // ── 지도 ──
  const map = L.map('map', { zoomControl: false, worldCopyJump: true })
    .setView([WAYPOINTS[0].lat, WAYPOINTS[0].lng], 5);
  L.control.zoom({ position: 'topright' }).addTo(map);
  // dark_nolabels: 국가/도시/바다 명칭 라벨이 없는 순수 지형 타일.
  // CartoDB dark_all은 동해를 "Sea of Japan(East Sea)" 병기로 표기하는데,
  // 이는 타일 자체에 래스터로 박힌 라벨이라 우리 쪽 지명 데이터로 고칠 수 없다.
  // 장소명은 어차피 마커·연도칩·하단 패널에서 우리가 직접 표기하므로
  // 베이스타일 라벨은 전부 제거하는 편이 정확하고 간단하다.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 12, minZoom: 2
  }).addTo(map);

  // 경로선 — 시간 순서를 잇는 점선
  L.polyline(WAYPOINTS.map(w => [w.lat, w.lng]), {
    color: '#b89860', weight: 2, opacity: .55, dashArray: '6 8'
  }).addTo(map);

  // 지점 마커
  const markers = WAYPOINTS.map((w, i) => {
    const icon = L.divIcon({ className: '', html: `<div class="wp-marker" data-i="${i}">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
    const m = L.marker([w.lat, w.lng], { icon }).addTo(map);
    m.on('click', () => go(i));
    return m;
  });

  // 연도 칩
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = WAYPOINTS.map((w, i) => `<button class="chip" data-i="${i}">${i + 1}. ${w.year}</button>`).join('');
  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (b) go(parseInt(b.dataset.i, 10));
  });

  // ── 패널 렌더 ──
  let cur = 0;
  const $ = id => document.getElementById(id);
  function go(i) {
    cur = Math.max(0, Math.min(WAYPOINTS.length - 1, i));
    const w = WAYPOINTS[cur];
    $('wpNum').textContent = cur + 1;
    $('wpYear').textContent = w.year;
    $('wpPlace').textContent = w.place;
    $('wpTitle').textContent = w.title;
    $('wpDesc').textContent = w.desc;
    // 이란 현대사 자료실 시리즈가 만들어지면 여기서 post id로 연결한다.
    $('wpLinks').innerHTML = w.post
      ? `<a href="../iran-modern/${w.post}.html">깊이 읽기 — 「이란 현대사」 시리즈에서 이 장면 읽기 &rsaquo;</a>` : '';
    $('progress').textContent = `${cur + 1} / ${WAYPOINTS.length}`;
    $('prevBtn').disabled = cur === 0;
    $('nextBtn').disabled = cur === WAYPOINTS.length - 1;
    document.querySelectorAll('.wp-marker').forEach(el => el.classList.toggle('active', parseInt(el.dataset.i, 10) === cur));
    document.querySelectorAll('.chip').forEach(el => el.classList.toggle('active', parseInt(el.dataset.i, 10) === cur));
    const activeChip = chipsEl.querySelector('.chip.active');
    if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    map.flyTo([w.lat, w.lng], w.zoom || 5, { duration: 1.1 });
    if (window.trackPageView) window.trackPageView('world_route_iran_hormuz', `wp_${cur + 1}`);
  }
  $('prevBtn').addEventListener('click', () => go(cur - 1));
  $('nextBtn').addEventListener('click', () => go(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(cur - 1);
    if (e.key === 'ArrowRight') go(cur + 1);
  });

  // 자료실 글(예: planck_1900.html)의 "세계지도 루트에서 이 장면 보기"에서
  // ?point=post_id로 들어오면 해당 웨이포인트로 바로 진입시킨다.
  const qp = new URLSearchParams(location.search).get('point');
  const startIdx = qp ? WAYPOINTS.findIndex(w => w.post === qp) : -1;
  go(startIdx >= 0 ? startIdx : 0);
})();
</script>
